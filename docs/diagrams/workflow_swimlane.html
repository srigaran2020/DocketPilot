<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocketPilot Workflow</title>
<style>
  html,body{margin:0;background:#ffffff}
  svg{display:block}
</style>
</head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" width="2600" height="1290" viewBox="0 0 2600 1290"></svg>
<script>
"use strict";
// ---------------- palette ----------------
const C = {ink:"#16231f", mute:"#5f6b66", rule:"#d9d3c4", paper:"#ffffff", desk:"#f7f4ec",
  spine:"#0f3b33", spine2:"#15514a", seal:"#c2410c", brass:"#b08a2e",
  userFill:"#fff4e8", userStroke:"#c2410c", feFill:"#ffffff", feStroke:"#7a8580",
  beFill:"#eaf3ef", beStroke:"#15514a", agFill:"#0f3b33", agStroke:"#b08a2e",
  veFill:"#fdf1d6", veStroke:"#9a6400", dsFill:"#f3efe4", dsStroke:"#b08a2e",
  ok:"#17663f", warn:"#9a6400", bad:"#b4231b"};

// ---------------- lanes ----------------
const LANES = [
  {id:"U", title:"LAWYER", sub:"user journey", y:96, h:150, fill:"#fffaf3", accent:C.seal},
  {id:"F", title:"FRONTEND", sub:"web app · HTML + JS", y:256, h:104, fill:"#ffffff", accent:"#7a8580"},
  {id:"B", title:"BACKEND", sub:"FastAPI · Python", y:370, h:270, fill:"#f6faf8", accent:C.spine2},
  {id:"L", title:"LANGGRAPH", sub:"7 agents · state graph", y:650, h:176, fill:"#f2f6f4", accent:C.spine},
  {id:"V", title:"VERIFICATION", sub:"anti-hallucination", y:836, h:160, fill:"#fffbf1", accent:C.warn},
  {id:"D", title:"DATA & AI", sub:"stores · models", y:1006, h:180, fill:"#faf8f2", accent:C.brass},
];
const LANE_X = 20, LANE_W = 2560, LABEL_W = 150, X0 = 190;

// ---------------- nodes ----------------
// shape: pill | box | dark | diamond | cyl | note ; lines: label lines (first line bold)
const N = {};
function node(id, shape, x, y, w, h, lines, style = {}) { N[id] = {id, shape, x, y, w, h, lines, ...style}; }

// Lane U — the lawyer
node("U1","pill", 200,148,160,54, ["Sign in","advocate / junior / admin"]);
node("U2","pill", 392,148,170,54, ["📎 Attach case papers","pdf · docx · txt"]);
node("U3","pill", 594,148,170,54, ["Review masking","untick · add missed"]);
node("U4","pill", 796,138,250,74, ["Ask or command","“Draft a legal notice” · “Verify this”","“Strategy?” · “Remind me on 12 Nov”"]);
node("U5","pill", 1530,148,250,54, ["Read the result","stamped answer / draft + evidence"]);
node("U6","diamond",1830,140,120,70, ["Red","items?"]);
node("U7","pill", 2010,148,190,54, ["Tick amber items","then Approve"]);
node("U8","pill", 2390,148,180,54, ["⬇ Download","Word file + calendar"]);

// Lane F — frontend
node("F1","box", 200,282,160,52, ["Sign-in page","features · login"]);
node("F2","box", 392,276,654,64, ["Ask DocketPilot chat","📎 attach · masking card · Explain-simply switch · case-file picker · How-to-use guide"]);
node("F3","box", 1530,276,420,64, ["Chat cards & draft view","stamps ✓ ! ✕ · anti-hallucination bar · evidence panel · ruled legal paper"]);
node("F4","box", 2010,276,560,64, ["Approve · Download · Dashboard","Matters · Research · Verify · deadlines calendar"]);

// Lane B — backend
node("B1","box", 200,404,160,76, ["Auth & audit","JWT · roles · firm isolation","append-only audit log"]);
node("B2","box", 392,404,300,76, ["Privacy gateway","detect Aadhaar✓ PAN phone IFSC account","address names → PERSON_1 · map → vault 🔐"]);
node("B3","diamond",820,466,190,96, ["Chat router","rules · no AI"]);
const TX = 1070, TW = 310;
node("T1","box", TX,384,TW,34, ["Verified answer (RAG)  ✦ 🔎 ⛨"], {small:true});
node("T2","box", TX,424,TW,34, ["Risk & strategy (RAG + checklist)  ✦ 🔎 ⛨"], {small:true});
node("T3","box", TX,464,TW,34, ["Similar past cases  🔎"], {small:true});
node("T4","box", TX,504,TW,34, ["Schedule by command  ✦ → reminder"], {small:true});
node("T5","box", TX,544,TW,34, ["Verify pasted text  ⛨"], {small:true});
node("T6","box", TX,584,TW,40, ["Draft → start LangGraph run"], {small:true, strong:true});
node("B4","box", 2150,470,232,64, ["Approve endpoint","advocate only · resumes the graph"]);
node("B5","note", 1430,388,520,230, ["What the router hears",
  "attach file → privacy gateway",
  "“…?” legal question → verified answer",
  "“strengths / weakness / strategy” → risk",
  "“similar / previous cases” → past cases",
  "“remind me / schedule …” → scheduler",
  "“verify / check …” or pasted draft → verifier",
  "“draft / prepare … notice / complaint” → LangGraph"]);

// Lane L — LangGraph agents
const AX = 1070, AW = 152, AG = 8;
const agents = [["① Orchestrator","rules"],["② Doc Analysis","✦ facts quote source"],["③ Research","🔎 law + precedents"],
  ["④ Drafting","✦ fills court template"],["⑤ Verification","⛨ can't be skipped"],["⑥ Strategy & Risk","checklist + past cases"],
  ["⑦ Monitoring","deadlines → reminders"]];
agents.forEach((a, i) => node("A" + (i + 1), "dark", AX + i * (AW + AG), 700, AW, 72, a));
node("A8","approval", AX + 7 * (AW + AG), 694, 152, 84, ["⏸ Approval","LangGraph interrupt"]);
node("A9","dark", AX + 8 * (AW + AG), 700, 152, 72, ["Finalize","🔐 names · .docx"]);
node("L0","note", 200,676,830,128, ["How the graph runs",
  "Typed state saved to PostgreSQL after every step (resumes after a crash).",
  "Pauses at the approval interrupt; Edit → re-verify, Approve → finalize.",
  "Timeouts and retries per agent; if verification fails, nothing is released."]);

// Lane V — verification engine
const VX = 1070, VW = 128, VG = 10;
const steps = [["1 Extract","citations · quotes"],["2 Normalise","SCR · SCC · AIR"],["3 Resolve","exact → alias → fuzzy"],
  ["4 Verdict","verified · partial ·","not found · conflict"],["5 Quote check","exact / near / none"],["6 AI judge ✦","must quote proof"],
  ["7 Good law","overruled? doubted?"],["8 Statute","in force on date?"]];
steps.forEach((s, i) => node("V" + (i + 1), "ve", VX + i * (VW + VG), 876, VW, 76, s));
node("VG","diamond", VX + 8 * (VW + VG) + 6, 872, 104, 84, ["9 Gate"]);
node("VR1","pill", 2330,860,150,30, ["✓ release"], {small:true, tone:"ok"});
node("VR2","pill", 2330,899,150,30, ["! acknowledge"], {small:true, tone:"warn"});
node("VR3","pill", 2330,938,150,30, ["✕ blocked"], {small:true, tone:"bad"});
node("V0","note", 200,862,830,112, ["Runs on every chat answer, every draft and any pasted text",
  "Steps 1–5, 7, 8 are database lookups and string matching: they cannot hallucinate.",
  "Only step 6 uses AI, and its answer is rejected unless it quotes the judgment.",
  "“Not found” means not in our library — never “fake”."]);

// Lane D — data & AI
node("D0","box", 200,1032,420,128, ["Offline knowledge build","AWS Open Data · SC + HC judgments (CC-BY-4.0)","India Code · NI Act sections + amendments","→ clean · split headnote/body · chunk","→ citation graph · s.138 tags · embeddings"]);
node("D1","cyl", 660,1030,330,132, ["PostgreSQL","cases · citations · graph · statutes","matters · drafts · reminders","audit log · LangGraph checkpoints"]);
node("D2","cyl", 1020,1030,170,132, ["Qdrant","vectors","bge-small"]);
node("D3","box", 1220,1040,330,112, ["🔎 Tiered retrieval","exact citation · statute as on date","keyword (Postgres FTS) · vector","hybrid fusion · cross-encoder rerank"]);
node("D4","box", 1580,1040,300,112, ["✦ Groq · gpt-oss-120b","receives masked text only","schema-checked JSON · retries"]);
node("D5","cyl", 1910,1030,200,132, ["🔐 Encrypted vault","placeholder → real name","local · per case file"]);
node("D6","box", 2140,1040,430,112, ["Reminders & files","dashboard · .ics calendar export","Word (.docx) with removable","verification appendix"]);

// ---------------- edges ----------------
// [from, to, opts]; side picks: r(ight) l(eft) t(op) b(ottom)
const E = [
  ["U1","U2"],["U2","U3"],["U3","U4"],
  ["U4","U5",{dash:true,label:"answer in seconds · draft in ~1 min"}],
  ["U5","U6"],["U6","U7",{label:"no"}],["U7","U8"],
  ["U6","U5",{loop:true,label:"yes → edit & re-check"}],
  ["U1","F1",{v:true,dash:true}],["U2","F2",{v:true,dash:true,at:470}],["U4","F2",{v:true,dash:true,at:920}],
  ["F3","U5",{v:true,dash:true,at:1655}],["U7","F4",{v:true,dash:true,at:2105}],["F4","U8",{v:true,dash:true,at:2480}],
  ["F1","B1",{v:true}],["F2","B2",{v:true,at:527}],["F2","B3",{v:true,at:915}],["F4","B4",{v:true,at:2266}],
  ["B3","T1",{fan:true}],["B3","T2",{fan:true}],["B3","T3",{fan:true}],["B3","T4",{fan:true}],["B3","T5",{fan:true}],["B3","T6",{fan:true}],
  ["T6","A1",{v:true,at:1143,label:""}],
  ["A1","A2"],["A2","A3"],["A3","A4"],["A4","A5"],["A5","A6"],["A6","A7"],["A7","A8"],["A8","A9"],
  ["A8","A5",{loopBelow:true,label:"edit → re-verify"}],
  ["B4","A8",{v:true,at:2266}],
  ["A5","V1",{elbowDown:true}],
  ["V1","V2"],["V2","V3"],["V3","V4"],["V4","V5"],["V5","V6"],["V6","V7"],["V7","V8"],["V8","VG"],
  ["VG","VR1",{fan:true}],["VG","VR2",{fan:true}],["VG","VR3",{fan:true}],
  ["A9","F4",{v:true,at:2440,up:true,label:""}],

  ["D0","D1"],["D1","D2",{both:true}],["D2","D3",{both:true}],
];

// ---------------- render ----------------
const svg = document.getElementById("d");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent = svg) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function text(x, y, s, o = {}) {
  const t = el("text", {x, y, "font-family": o.serif ? "Georgia, 'Times New Roman', serif" : "'Segoe UI', Arial, sans-serif",
    "font-size": o.size || 13, "font-weight": o.bold ? 700 : 400, fill: o.fill || C.ink, "text-anchor": o.anchor || "middle",
    "letter-spacing": o.ls || 0, "dominant-baseline": "middle"}, o.parent);
  t.textContent = s; return t;
}

const defs = el("defs", {});
[["arrow", C.ink], ["arrowMute", "#7a8580"], ["arrowSeal", C.seal]].forEach(([id, col]) => {
  const m = el("marker", {id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse"}, defs);
  el("path", {d: "M0,0 L10,5 L0,10 z", fill: col}, m);
});

// header
el("rect", {x: 0, y: 0, width: 2600, height: 1290, fill: C.paper});
text(LANE_X + 4, 40, "DocketPilot — end-to-end workflow", {serif: true, bold: true, size: 32, anchor: "start"});
text(LANE_X + 4, 74, "From the lawyer’s first click to a verified, approved court document — every agent, the LangGraph state graph, the backend and the data.", {size: 16, fill: C.mute, anchor: "start"});
el("rect", {x: LANE_X, y: 86, width: LANE_W, height: 3, fill: C.brass});

// lanes
LANES.forEach(l => {
  el("rect", {x: LANE_X, y: l.y, width: LANE_W, height: l.h, fill: l.fill, stroke: C.rule, "stroke-width": 1});
  el("rect", {x: LANE_X, y: l.y, width: LABEL_W, height: l.h, fill: l.accent});
  text(LANE_X + LABEL_W / 2, l.y + l.h / 2 - 10, l.title, {bold: true, size: 15, fill: "#fff", ls: 1.5});
  text(LANE_X + LABEL_W / 2, l.y + l.h / 2 + 12, l.sub, {size: 11.5, fill: "#ffffffcc"});
});

function drawNode(n) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  const tone = n.tone ? {ok: [C.ok, "#e5f2ea"], warn: [C.warn, "#fdf2d9"], bad: [C.bad, "#fbe6e3"]}[n.tone] : null;
  let fill = C.feFill, stroke = C.feStroke, fg = C.ink, sub = C.mute;
  const lane = LANES.find(l => cy >= l.y && cy <= l.y + l.h).id;
  if (lane === "U") { fill = C.userFill; stroke = C.userStroke; }
  if (lane === "B") { fill = C.beFill; stroke = C.beStroke; }
  if (lane === "V") { fill = C.veFill; stroke = C.veStroke; }
  if (lane === "D") { fill = C.dsFill; stroke = C.dsStroke; }
  if (n.shape === "dark") { fill = C.agFill; stroke = C.agStroke; fg = "#fff"; sub = "#cfe0d9"; }
  if (n.shape === "approval") { fill = C.seal; stroke = "#7a2a08"; fg = "#fff"; sub = "#ffe2d2"; }
  if (n.strong) { fill = C.spine2; stroke = C.spine; fg = "#fff"; }
  if (tone) { stroke = tone[0]; fill = tone[1]; fg = tone[0]; }
  if (n.shape === "note") {
    el("rect", {x: n.x, y: n.y, width: n.w, height: n.h, rx: 6, fill: "#ffffffb3", stroke: C.rule, "stroke-dasharray": "5 4"});
    text(n.x + 16, n.y + 22, n.lines[0], {bold: true, size: 13.5, anchor: "start", fill: C.spine});
    n.lines.slice(1).forEach((s, i) => text(n.x + 16, n.y + 46 + i * 22, "• " + s, {size: 13, anchor: "start", fill: C.ink}));
    return;
  }
  if (n.shape === "pill") el("rect", {x: n.x, y: n.y, width: n.w, height: n.h, rx: n.h / 2, fill, stroke, "stroke-width": 1.6});
  else if (n.shape === "diamond") el("polygon", {points: `${cx},${n.y} ${n.x + n.w},${cy} ${cx},${n.y + n.h} ${n.x},${cy}`, fill: n.id === "VG" ? "#fff" : fill, stroke, "stroke-width": 1.6});
  else if (n.shape === "cyl") {
    const ry = 12;
    el("path", {d: `M${n.x},${n.y + ry} L${n.x},${n.y + n.h - ry} A${n.w / 2},${ry} 0 0 0 ${n.x + n.w},${n.y + n.h - ry} L${n.x + n.w},${n.y + ry}`, fill, stroke, "stroke-width": 1.6});
    el("ellipse", {cx, cy: n.y + ry, rx: n.w / 2, ry, fill: "#fffaf0", stroke, "stroke-width": 1.6});
  } else if (n.shape === "approval") {
    const k = 16;
    el("polygon", {points: `${n.x + k},${n.y} ${n.x + n.w - k},${n.y} ${n.x + n.w},${cy} ${n.x + n.w - k},${n.y + n.h} ${n.x + k},${n.y + n.h} ${n.x},${cy}`, fill, stroke, "stroke-width": 2});
  } else el("rect", {x: n.x, y: n.y, width: n.w, height: n.h, rx: n.shape === "dark" ? 6 : 5, fill, stroke, "stroke-width": n.shape === "dark" ? 2 : 1.4});
  const lines = n.lines, lh = n.small ? 15 : 16.5;
  const top = (n.shape === "cyl" ? cy + 6 : cy) - (lines.length - 1) * lh / 2;
  lines.forEach((s, i) => text(cx, top + i * lh, s, {bold: i === 0, size: i === 0 ? (n.small ? 13 : 14) : 12, fill: i === 0 ? fg : sub,
    serif: i === 0 && !n.small && n.shape !== "diamond"}));
}

function pt(n, side) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  return {r: [n.x + n.w, cy], l: [n.x, cy], t: [cx, n.y], b: [cx, n.y + n.h]}[side];
}
function arrow(d, o = {}) {
  el("path", {d, fill: "none", stroke: o.dash ? "#7a8580" : (o.color || C.ink), "stroke-width": o.dash ? 1.5 : 1.7,
    "stroke-dasharray": o.dash ? "6 5" : "", "marker-end": `url(#${o.dash ? "arrowMute" : (o.marker || "arrow")})`,
    "marker-start": o.both ? "url(#arrow)" : ""});
}
function label(x, y, s, o = {}) {
  if (!s) return;
  const w = s.length * 6.6 + 14;
  el("rect", {x: x - w / 2, y: y - 10, width: w, height: 20, rx: 10, fill: "#fff", stroke: o.color || C.rule});
  text(x, y + 1, s, {size: 11.5, fill: o.color || C.mute});
}

function drawEdge([a, b, o = {}]) {
  const A = N[a], B = N[b];
  if (o.loop) { // U6 back to U5, above
    const [x1, y1] = pt(A, "t"), [x2, y2] = pt(B, "t");
    arrow(`M${x1},${y1} C${x1},${y1 - 34} ${x2},${y2 - 34} ${x2},${y2}`, {color: C.seal, marker: "arrowSeal"});
    label((x1 + x2) / 2, y1 - 26, o.label, {color: C.seal}); return;
  }
  if (o.loopBelow) {
    const [x1, y1] = pt(A, "b"), [x2, y2] = pt(B, "b");
    arrow(`M${x1},${y1} C${x1},${y1 + 34} ${x2},${y2 + 34} ${x2},${y2}`, {color: C.seal, marker: "arrowSeal"});
    label((x1 + x2) / 2, y1 + 24, o.label, {color: C.seal}); return;
  }
  if (o.fan) {
    const [x1, y1] = pt(A, "r"), [x2, y2] = pt(B, "l");
    const mx = x1 + 30;
    arrow(`M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`);
    return;
  }
  if (o.elbowDown) { // A5 → V1
    const [x1, y1] = pt(A, "b"), [x2, y2] = pt(B, "t");
    const my = y1 + 44;
    arrow(`M${x1},${y1} L${x1},${my} L${x2},${my} L${x2},${y2}`, {color: C.warn});
    label((x1 + x2) / 2, my, "every citation, quote and section", {color: C.warn}); return;
  }
  if (o.v) {
    const up = o.up || A.y > B.y;
    const x = o.at || (A.x + A.w / 2);
    const y1 = up ? A.y : A.y + A.h, y2 = up ? B.y + B.h : B.y;
    arrow(`M${x},${y1} L${x},${y2}`, o);
    return;
  }
  const [x1, y1] = pt(A, "r"), [x2, y2] = pt(B, "l");
  if (Math.abs(y1 - y2) < 2) arrow(`M${x1},${y1} L${x2},${y2}`, o);
  else arrow(`M${x1},${y1} C${x1 + 40},${y1} ${x2 - 40},${y2} ${x2},${y2}`, o);
  if (o.label) label((x1 + x2) / 2, (y1 + y2) / 2 - 16, o.label);
}

E.forEach(drawEdge);
Object.values(N).forEach(drawNode);

// legend
const ly = 1222;
el("rect", {x: LANE_X, y: ly - 18, width: LANE_W, height: 56, fill: C.desk, stroke: C.rule});
const legend = [["✦", "calls the AI model (masked text only)"], ["🔎", "uses tiered retrieval (RAG)"], ["⛨", "passes through the verification engine"],
  ["🔐", "encrypted vault (real names)"], ["- - →", "user action through the interface"], ["⟶", "data / control flow"]];
let lx = LANE_X + 24;
legend.forEach(([sym, s]) => { text(lx, ly + 10, sym, {size: 16, anchor: "start", bold: true, fill: C.spine});
  text(lx + 34, ly + 10, s, {size: 13.5, anchor: "start", fill: C.ink}); lx += 34 + s.length * 7.2 + 40; });
text(LANE_X + LANE_W - 20, ly + 10, "Prototype · not legal advice", {size: 12.5, anchor: "end", fill: C.mute});
document.body.setAttribute("data-done", "1");
</script>
</body>
</html>
