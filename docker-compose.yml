# Start everything:   docker compose up -d --build
# Stop:               docker compose down        (data is kept in named volumes)
# All ports listen on 127.0.0.1 only, so nothing is reachable from other machines.
name: docketpilot

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://docketpilot:${POSTGRES_PASSWORD}@postgres:5432/docketpilot
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  S3_ENDPOINT: objectstore:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  JWT_SECRET: ${JWT_SECRET}
  GROQ_API_KEY: ${GROQ_API_KEY}
  LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-openai/gpt-oss-120b}
  VAULT_KEY: ${VAULT_KEY}

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: docketpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docketpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docketpilot -d docketpilot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4.1
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes: [qdrantdata:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]

  # S3-compatible object storage. SeaweedFS replaces MinIO, whose free images are no longer published.
  objectstore:
    image: chrislusf/seaweedfs:3.80
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"docketpilot","credentials":[{"accessKey":"%s","secretKey":"%s"}],
        "actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0
    volumes: [objectdata:/data]
    ports: ["127.0.0.1:8333:8333"]

  # Containerised API (optional; start.ps1 runs the API from .venv instead, see docs/DECISIONS.md #15).
  # Use:  docker compose --profile container up -d --build
  api:
    profiles: ["container"]
    build: .
    environment: *api-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      objectstore: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  objectdata:
